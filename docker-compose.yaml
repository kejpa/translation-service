services:
  translator:
    build: .
    container_name: translation-service
    ports:
      - "${PORT:-8000}:8000"
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
