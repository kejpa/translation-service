services:
  translator:
    image: ghcr.io/kejpa/translation-service:latest

    container_name: translation-service

    ports:
      - "${PORT:-8000}:8000"

    restart: unless-stopped

    volumes:
      - ./docs:/app/runtime-docs
      - ./:/app/runtime-host

  ollama:
    image: ollama/ollama

    container_name: ollama

    restart: unless-stopped

    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
