[project]
name = "translation-service"
version = "0.1.0"
description = "Local translation service using FastAPI and Ollama"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"