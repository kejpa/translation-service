[project]
name = "translation-service"
version = "0.1.0"
description = "Local translation service using FastAPI and Ollama"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "pydantic",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx2>=2.12.0",
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "sqlalchemy>=2.0.52",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
